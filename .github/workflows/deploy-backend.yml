name: Deploy HireScope Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:

permissions:
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions
          ping: ${{ secrets.SERVER_HOST }}

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}' \
            > ~/.ssh/hirescope_deploy_key

          chmod 600 ~/.ssh/hirescope_deploy_key

          ssh-keyscan -H '${{ secrets.SERVER_HOST }}' \
            >> ~/.ssh/known_hosts

      - name: Deploy backend
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/hirescope_deploy_key \
            debian@${{ secrets.SERVER_HOST }} \
            'cd ~/rahul/switch-sync/backend && \
             git pull --ff-only origin main && \
             docker compose up -d --build'

      - name: Verify deployment
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/hirescope_deploy_key \
            debian@${{ secrets.SERVER_HOST }} \
            'curl -fsS http://localhost:3000/health'