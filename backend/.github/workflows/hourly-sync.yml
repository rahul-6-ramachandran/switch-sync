name: HireScope Hourly Sync

on:
  schedule:
    # Runs at the start of every hour
    - cron: "0 * * * *"

  # Allows you to manually run it from GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger HireScope Sync
        run: |
          curl --fail --request POST \
            --header 'Authorization: Bearer ${{ secrets.SYNC_SECRET }}' \
            https://hirescope-backend-a9pu.onrender.com/engine/sync